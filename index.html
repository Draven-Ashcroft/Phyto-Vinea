<script>
/* -----------------------------------------------------------------------
   Generic helpers, reused verbatim from the sibling builds.
   ----------------------------------------------------------------------- */
function toRad(deg) { return (deg * Math.PI) / 180; }

function smoothstep(x) {
  const t = Math.max(0, Math.min(1, x));
  return t * t * (3 - 2 * t);
}

function taperWidths(n, wStart, wEnd) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const curved = Math.pow(t, 1.75);
    arr.push(wStart + (wEnd - wStart) * curved);
  }
  return arr;
}

function catmullRomD(pts, startCmd = 'M') {
  if (pts.length < 2) return '';
  let d = `${startCmd} ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[Math.min(pts.length - 1, i + 2)];
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

function ribbonPath(pts, widths) {
  const n = pts.length, left = [], right = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const prev = pts[Math.max(0, i - 1)];
    const next = pts[Math.min(n - 1, i + 1)];
    const dx = next.x - prev.x, dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len, w = widths[i];
    left.push({ x: p.x + (nx * w) / 2, y: p.y + (ny * w) / 2 });
    right.push({ x: p.x - (nx * w) / 2, y: p.y - (ny * w) / 2 });
  }
  const fwd  = catmullRomD(left, 'M');
  const back = catmullRomD(right.slice().reverse(), 'L');
  return `${fwd} ${back} Z`;
}

/* -----------------------------------------------------------------------
   Scene geometry.
   ----------------------------------------------------------------------- */
const groundY = 430, potW = 145, potH = 175, soilDepth = 130;
const leftX = 240, rightX = 660;
const STICK_OFFSET = 18;   // stick sits this far to the side of the stem — kept within REACH_DIST
const STICK_HEIGHT = 185; // tall enough to contain the full coil at max growth — verified with margin

/* -----------------------------------------------------------------------
   Stem growth — same "straight up with organic wobble" model used
   throughout the other builds.
   ----------------------------------------------------------------------- */
const STEM_RATE = 1.2126;
const STEM_MAX_LEN = 70; // stem stops lengthening around hour 58; further growth goes into the tendril
const TENDRIL_RATE = 0.3901; // tuned so the tendril JUST reaches the stick (coilFrac~0) at TENDRIL_ENABLE_HOUR, then coils up gradually during phase 2
const STEPS = 90;
const TENDRIL_ENABLE_HOUR = 109; // when the Tendril button unlocks — clicking it starts the phase-2 sweep from here

function buildStemPath(originX, originY, hours, wobbleSeed) {
  const totalLen = Math.min(STEM_MAX_LEN, STEM_RATE * hours);
  const pts = [{ x: originX, y: originY }];
  let x = originX, y = originY;
  const segLen = totalLen / STEPS;
  for (let i = 1; i <= STEPS; i++) {
    const s = i / STEPS;
    const wob = Math.sin(i * 0.24 + wobbleSeed) * 0.5 * Math.pow(s, 0.5);
    const rad = toRad(wob);
    x += Math.sin(rad) * segLen;
    y -= Math.cos(rad) * segLen;
    pts.push({ x, y });
  }
  return pts;
}

function stemTendrilLen(hours) {
  const hoursWhenStemMaxed = STEM_MAX_LEN / STEM_RATE;
  return Math.max(0, TENDRIL_RATE * (hours - hoursWhenStemMaxed));
}

/* -----------------------------------------------------------------------
   Tendril — searching (straight/gentle-curl) and coiled variants share
   the same reaching base so a lerp between them "crawls" smoothly
   instead of jump-cutting between two unrelated shapes.
   ----------------------------------------------------------------------- */
const REACH_DIST = 20;
const COIL_RADIUS = 10;
const COIL_TURNS = 2.4;
const COIL_V_SPAN = 78;
const COIL_LEN_NORM = 40; // tendril length (beyond REACH_DIST) at which the coil reaches its full COIL_TURNS

function buildSearchingTendril(originX, originY, totalLen, wobbleSeed) {
  const pts = [{ x: originX, y: originY }];
  let x = originX, y = originY;
  const segLen = totalLen / STEPS;
  for (let i = 1; i <= STEPS; i++) {
    const s = i / STEPS;
    // A gentle, natural curl — real tendrils aren't perfectly straight
    // even before finding a support.
    const curl = 22 * smoothstep(s);
    const wob = Math.sin(i * 0.3 + wobbleSeed) * 3;
    const rad = toRad(curl + wob);
    x += Math.sin(rad) * segLen;
    y -= Math.cos(rad) * segLen;
    pts.push({ x, y });
  }
  return pts;
}

function buildCoiledTendril(originX, originY, totalLen, stickX, wobbleSeed) {
  const pts = [{ x: originX, y: originY }];
  const reachLen = Math.min(totalLen, REACH_DIST);
  const reachSteps = Math.max(1, Math.round(STEPS * (reachLen / Math.max(totalLen, 0.01))));
  let x = originX, y = originY;
  for (let i = 1; i <= reachSteps; i++) {
    const s = i / reachSteps;
    const targetX = originX + (stickX - originX) * s * 0.92;
    const targetY = originY - reachLen * s;
    x = targetX; y = targetY;
    pts.push({ x, y });
  }
  const coilLen = Math.max(0, totalLen - reachLen);
  const coilSteps = STEPS - reachSteps;
  const base = pts[pts.length - 1];
  const coilFrac = Math.min(1, coilLen / COIL_LEN_NORM);
  for (let i = 1; i <= coilSteps; i++) {
    const s = (i / Math.max(1, coilSteps)) * coilFrac;
    const theta = s * COIL_TURNS * 2 * Math.PI;
    const wob = Math.sin(i * 0.5 + wobbleSeed) * 1.2;
    x = stickX + (COIL_RADIUS + wob) * Math.sin(theta);
    y = base.y - s * COIL_V_SPAN;
    pts.push({ x, y, isFront: Math.cos(theta) > 0 });
  }
  return pts;
}



/* -----------------------------------------------------------------------
   Rendering — pot, stick, leaflets, stem, and the tendril split into
   front/back segments so it visually wraps around the stick rather
   than always drawing on top of it.
   ----------------------------------------------------------------------- */
function potMarkup(cx) {
  const topW = potW * 1.1, rimRy = 8;
  // Curved silhouette (quadratic sides with a subtle outward bulge) instead
  // of a flat 4-point trapezoid — the straight sides were the single
  // biggest reason the pot read as a geometric/cartoon shape.
  const bottomHalfW = (potW / 2) * 0.85, bulgeHalfW = (potW / 2) * 1.05, topHalfW = topW / 2;
  const bulgeY = groundY - potH * 0.4;
  const potPath = `
    M ${(cx - bottomHalfW).toFixed(1)} ${groundY}
    Q ${(cx - bulgeHalfW).toFixed(1)} ${(groundY - potH * 0.2).toFixed(1)} ${(cx - bulgeHalfW).toFixed(1)} ${bulgeY.toFixed(1)}
    Q ${(cx - bulgeHalfW).toFixed(1)} ${(groundY - potH * 0.75).toFixed(1)} ${(cx - topHalfW).toFixed(1)} ${(groundY - potH).toFixed(1)}
    L ${(cx + topHalfW).toFixed(1)} ${(groundY - potH).toFixed(1)}
    Q ${(cx + bulgeHalfW).toFixed(1)} ${(groundY - potH * 0.75).toFixed(1)} ${(cx + bulgeHalfW).toFixed(1)} ${bulgeY.toFixed(1)}
    Q ${(cx + bulgeHalfW).toFixed(1)} ${(groundY - potH * 0.2).toFixed(1)} ${(cx + bottomHalfW).toFixed(1)} ${groundY}
    Z
  `;
  const soilTopY = groundY - soilDepth;
  const soilTopHalf = potW / 2 + (topW / 2 - potW / 2) * (soilDepth / potH);
  // Texture kept at a conservative inset — verified against the narrowest
  // point of the curved silhouette (the base, half-width 61.6 at this
  // potW), not just eyeballed, so it can't poke past the outline.
  const bodyHalf = bottomHalfW * 0.85;
  let texture = "";
  for (let i = 0; i < 10; i++) {
    const ty = groundY - potH + 20 + ((i * 17) % (potH - 30));
    const shade = i % 2 === 0 ? "rgba(0,0,0,0.10)" : "rgba(255,220,190,0.08)";
    texture += `<line x1="${(cx - bodyHalf).toFixed(1)}" y1="${ty}" x2="${(cx + bodyHalf).toFixed(1)}" y2="${ty}" stroke="${shade}" stroke-width="1.2"></line>`;
  }
  let speckle = "";
  for (let i = 0; i < 40; i++) {
    const sx = cx - bodyHalf + ((i * 37) % (bodyHalf * 2));
    const sy = groundY - potH + 8 + ((i * 23) % (potH - 16));
    const r = 0.5 + (i % 3) * 0.3;
    const c = i % 2 === 0 ? "rgba(0,0,0,0.08)" : "rgba(255,230,200,0.10)";
    speckle += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${r.toFixed(1)}" fill="${c}"></circle>`;
  }
  // Soil texture — was radius 0.6 at 20% opacity, effectively invisible at
  // this scale. Bigger, more numerous, higher-contrast crumbs/pebbles now.
  let soilFleck = "";
  for (let i = 0; i < 30; i++) {
    const fx = cx - soilTopHalf * 0.82 + ((i * 23.7) % (soilTopHalf * 1.64));
    const fy = soilTopY + 1 + (i % 4) * 1.8;
    const r = 1.1 + (i % 3) * 0.7;
    const tone = i % 3;
    const c = tone === 0 ? "rgba(10,6,3,0.45)" : tone === 1 ? "rgba(210,175,130,0.4)" : "rgba(90,60,35,0.5)";
    soilFleck += `<ellipse cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r * 0.7).toFixed(1)}" fill="${c}"></ellipse>`;
  }
  return `
    <ellipse cx="${cx}" cy="${groundY + 8}" rx="${potW * 0.66}" ry="9" fill="url(#groundShadow)"></ellipse>
    <path d="${potPath}" fill="url(#potClayGrad)" stroke="#6e3c20" stroke-width="1.5"></path>
    ${texture}
    ${speckle}
    <path d="${`M ${cx - soilTopHalf} ${soilTopY} L ${cx + soilTopHalf} ${soilTopY} L ${cx + soilTopHalf * 0.94} ${soilTopY + 6} L ${cx - soilTopHalf * 0.94} ${soilTopY + 6} Z`}" fill="url(#soilGrad)"></path>
    <ellipse cx="${cx}" cy="${soilTopY}" rx="${soilTopHalf}" ry="${soilTopHalf * 0.15}" fill="#241608" opacity="0.5"></ellipse>
    ${soilFleck}
    <ellipse cx="${cx}" cy="${groundY - potH}" rx="${topW / 2 + 4}" ry="${rimRy}" fill="url(#potRimGrad)" stroke="#6e3c20" stroke-width="1.2"></ellipse>
  `;
}

function stickMarkup(stickX, soilSurfaceY) {
  const topY = soilSurfaceY - STICK_HEIGHT;
  return `
    <path d="M ${stickX - 3.2} ${soilSurfaceY + 6} L ${stickX - 2.2} ${topY + 10} L ${stickX} ${topY} L ${stickX + 2.2} ${topY + 10} L ${stickX + 3.2} ${soilSurfaceY + 6} Z" fill="url(#stickGrad)" stroke="#3d2914" stroke-width="0.6"></path>
    <line x1="${stickX - 1.6}" y1="${soilSurfaceY - 30}" x2="${stickX - 1.6}" y2="${soilSurfaceY - 60}" stroke="rgba(60,38,18,0.35)" stroke-width="0.8"></line>
    <line x1="${stickX + 1.2}" y1="${soilSurfaceY - 90}" x2="${stickX + 1.2}" y2="${soilSurfaceY - 120}" stroke="rgba(60,38,18,0.3)" stroke-width="0.7"></line>
  `;
}

function leafletMarkup(x, y, angle) {
  const r = toRad(angle);
  const length = 15, width = 7;
  const baseX = x + Math.cos(r) * 3, baseY = y + Math.sin(r) * 3;
  const tipX = baseX + Math.cos(r) * length, tipY = baseY + Math.sin(r) * length;
  const midX = baseX + Math.cos(r) * (length * 0.55), midY = baseY + Math.sin(r) * (length * 0.55);
  const perpX = -Math.sin(r) * (width / 2), perpY = Math.cos(r) * (width / 2);
  const d = `M ${baseX.toFixed(1)} ${baseY.toFixed(1)} Q ${(midX + perpX).toFixed(1)} ${(midY + perpY).toFixed(1)} ${tipX.toFixed(1)} ${tipY.toFixed(1)} Q ${(midX - perpX).toFixed(1)} ${(midY - perpY).toFixed(1)} ${baseX.toFixed(1)} ${baseY.toFixed(1)} Z`;
  const vein = `M ${baseX.toFixed(1)} ${baseY.toFixed(1)} L ${tipX.toFixed(1)} ${tipY.toFixed(1)}`;
  return `
    <ellipse cx="${baseX.toFixed(1)}" cy="${(baseY + 1).toFixed(1)}" rx="2.2" ry="1" fill="rgba(20,30,10,0.25)"></ellipse>
    <path d="${d}" fill="url(#leafGrad)" stroke="rgba(40,60,20,0.3)" stroke-width="0.5"></path>
    <path d="${vein}" stroke="rgba(30,45,15,0.35)" stroke-width="0.5" fill="none"></path>
  `;
}

function stemMarkup(pts) {
  const widths = taperWidths(pts.length, 6.5, 3);
  let leaflets = "";
  [0.35, 0.6, 0.82].forEach((frac) => {
    const idx = Math.round(frac * (pts.length - 1));
    const p = pts[idx];
    leaflets += leafletMarkup(p.x, p.y, -35) + leafletMarkup(p.x, p.y, 35);
  });
  const fiberOffsets = [-1.5, 1.5];
  let fibers = "";
  fiberOffsets.forEach((off) => {
    const fiberPts = pts.filter((_, i) => i % 4 === 0).map((p) => ({ x: p.x + off, y: p.y }));
    if (fiberPts.length > 1) fibers += `<path d="${catmullRomD(fiberPts)}" stroke="rgba(30,45,15,0.18)" stroke-width="0.6" fill="none"></path>`;
  });
  const base = pts[0];
  return `
    <ellipse cx="${base.x.toFixed(1)}" cy="${(base.y + 1).toFixed(1)}" rx="5" ry="2" fill="rgba(20,30,10,0.3)"></ellipse>
    <path d="${ribbonPath(pts, widths)}" fill="url(#stemGrad)" stroke="rgba(35,55,20,0.35)" stroke-width="0.5"></path>
    ${fibers}
    ${leaflets}
  `;
}

function tendrilSegmentsMarkup(pts) {
  // Split into contiguous front/back runs so the stick can be drawn
  // between them — this is what makes the coil look like it's actually
  // wrapping around the stick rather than always sitting on top of it.
  const widths = taperWidths(pts.length, 2.6, 1);
  const runs = [];
  let currentFront = pts[0].isFront !== false;
  let start = 0;
  for (let i = 1; i < pts.length; i++) {
    const f = pts[i].isFront !== false;
    if (f !== currentFront) {
      runs.push({ front: currentFront, start, end: i });
      start = i;
      currentFront = f;
    }
  }
  runs.push({ front: currentFront, start, end: pts.length - 1 });

  let back = "", front = "";
  runs.forEach((run) => {
    const segPts = pts.slice(run.start, run.end + 1);
    const segWidths = widths.slice(run.start, run.end + 1);
    if (segPts.length < 2) return;
    const d = `<path d="${ribbonPath(segPts, segWidths)}" fill="url(#tendrilGrad)" stroke="rgba(35,55,20,0.3)" stroke-width="0.4"></path>`;
    if (run.front) front += d; else back += d;
  });
  return { back, front };
}

/* -----------------------------------------------------------------------
   Render + controls.
   ----------------------------------------------------------------------- */
let hoursState = 0;
let playing = false, playStart = 0, playRAF = null;
const PLAY_DURATION_MS = 22000; // phase 1: 0 -> TENDRIL_ENABLE_HOUR
const MAX_HOURS = 250;

let coiling = false; // simple gate: has Tendril been triggered? coiling shape then follows hoursState naturally, no separate animation needed
let tendrilPlaying = false, tendrilPlayStart = 0, tendrilPlayRAF = null;
const TENDRIL_PLAY_DURATION_MS = 26000; // phase 2: TENDRIL_ENABLE_HOUR -> MAX_HOURS, deliberately a bit slower so students have time to watch it happen


/* =========================================================================
   MAGNIFIER — cross-section view instead of a bending mesh. The other
   three sims all show a simple left/right or up/down lean, which a side
   view mesh captures well. A tendril's coil is a genuinely 3D wrap-around
   motion — rather than build a mismatched mesh for it, this shows the
   tendril end-on: auxin particles start clustered at the center (no
   touch stimulus yet) and migrate outward toward the periphery as
   the coiling phase progresses, tracking the same hours-based state
   that drives the coil shape directly, so the two are always in sync.
   ========================================================================= */
const MAG_PARTICLE_COUNT = 30;
const MAG_TIP_THRESHOLD  = 198;

// Packed capsule-shaped cells instead of angular wedges. Wedges — no
// matter how square each one is made — are fundamentally "sectors
// radiating from a point," which always reads as a pie chart. Individual
// cells packed in concentric rings don't have that problem, and a
// capsule (rounded-rect) shape lets each cell visibly stretch when it
// elongates rather than just growing a circle bigger. theta=0 (right) is
// the contact/compact side, theta=180 (left) is the elongating/away side.
const N_ROWS = 4;
const CORE_R = 11;
const RING_SPACING = 15;
const BASE_CELL_L = 9.5;  // length (radial axis) at rest
const BASE_CELL_W = 9.5;  // width (tangential axis) — narrows slightly as the cell stretches, like a real elongating cell
const N_COLS_PER_ROW = [7, 15, 24, 33]; // tuned so cells nearly touch at rest (ratio 0.87-0.96) instead of leaving large gaps — verified numerically
const GROWTH_FACTOR = [0.2, 0.45, 0.8, 1.3]; // outer rings elongate more, matching a real elongation-zone gradient — boosted for clearer contrast

function shadeVariant(hex, shift) {
  const r = Math.max(0, Math.min(255, parseInt(hex.slice(1, 3), 16) + shift));
  const g = Math.max(0, Math.min(255, parseInt(hex.slice(3, 5), 16) + shift));
  const b = Math.max(0, Math.min(255, parseInt(hex.slice(5, 7), 16) + shift));
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

function closedCatmullRomD(pts) {
  // Same tension formula as catmullRomD, but wraps indices around
  // (modulo) instead of clamping, so the spline closes into a loop —
  // used for the membrane outline.
  const n = pts.length;
  if (n < 3) return "";
  let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n];
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    const p3 = pts[(i + 2) % n];
    const cp1x = p1.x + (p2.x - p0.x) / 6, cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6, cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d + " Z";
}

const magCellGrid = []; // magCellGrid[row][col] = { el, dot }

function initMagCellRing() {
  magCellGrid.length = 0;
  const host = document.getElementById("magCellRing");
  host.innerHTML = "";
  for (let row = 0; row < N_ROWS; row++) {
    const rowEls = [];
    for (let col = 0; col < N_COLS_PER_ROW[row]; col++) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      el.setAttribute("stroke", "rgba(20,35,10,0.45)");
      el.setAttribute("stroke-width", "0.8");
      host.appendChild(el);

      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("r", "1.5");
      dot.setAttribute("fill", "rgba(140,150,225,0.55)");
      dot.setAttribute("stroke", "rgba(70,75,140,0.6)");
      dot.setAttribute("stroke-width", "0.4");
      host.appendChild(dot);

      rowEls.push({ el, dot, dx: 0, dy: 0, vx: 0, vy: 0 });
    }
    magCellGrid.push(rowEls);
  }
}

let magX = 150, magY = 150, magScale = 0.75, magDragging = false, magAnimId = null;
let tendrilPaths = {};
let rightStickXGlobal = 0;
const magParticles = [];

function initMagParticles() {
  magParticles.length = 0;
  const host = document.getElementById("magParticles");
  host.innerHTML = "";
  const arcSpread = (95 * Math.PI) / 180; // wider now that it's a scattered cloud, not a tight arc
  for (let i = 0; i < MAG_PARTICLE_COUNT; i++) {
    const thetaOffset = (Math.random() - 0.5) * arcSpread; // randomized, not evenly spaced — avoids a string-of-beads look
    const radiusJitter = (Math.random() - 0.5) * 18; // each particle settles at its own radius, not one shared arc
    const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    el.setAttribute("r", (2.3 + Math.random() * 1.3).toFixed(1));
    el.setAttribute("fill", "url(#auxinGlow)");
    el.setAttribute("stroke", "rgba(60,38,6,0.65)");
    el.setAttribute("stroke-width", "0.8");
    host.appendChild(el);
    magParticles.push({ thetaOffset, radiusJitter, easedR: 0, jx: 0, jy: 0, el });
  }
}

function clampMagPosition() {
  const margin = 176 * magScale;
  magX = Math.max(margin, Math.min(900 - margin, magX));
  magY = Math.max(margin, Math.min(500 - margin, magY));
}

function positionMagnifier() {
  document.getElementById("magnifier").setAttribute(
    "transform",
    `translate(${magX.toFixed(1)}, ${magY.toFixed(1)}) scale(${magScale.toFixed(2)})`
  );
}

function setMagScale(delta) {
  magScale = Math.max(0.7, Math.min(1.42, magScale + delta)); // 1.42 is the true ceiling: margin=176*scale must stay <=250 (half the 500px panel height) or the Y-drag range inverts
  clampMagPosition();
  positionMagnifier();
}

let magOrganMatch = null;
let magMatchedPoint = null;
// Orientation sign eases between +1 (normal: elongating=left) and -1
// (flipped: elongating=right) based on which side of the stick the
// magnifier's current position is actually on, reusing the same
// isFront flag already computed for the coil's front/back occlusion
// rendering in the main scene. Continuous, not a snap, since crossing
// from one side to the other should visibly transition.
let magOrientSign = 1;

function updateMagLabel() {
  const candidates = [
    { key: "leftTendril",  name: "Control Tendril",      pot: "left"  },
    { key: "rightTendril", name: "Experimental Tendril", pot: "right" },
  ];
  let best = null, bestDist = Infinity, bestPoint = null;
  candidates.forEach((c) => {
    const path = tendrilPaths[c.key];
    if (!path) return;
    for (let i = 0; i < path.length; i++) {
      const p = path[i];
      const d = Math.hypot(p.x - magX, p.y - magY);
      if (d < bestDist) { bestDist = d; best = c; bestPoint = p; }
    }
  });
  const labelEl = document.getElementById("magLabelText");
  if (best && bestDist < MAG_TIP_THRESHOLD) {
    labelEl.textContent = best.name;
    magOrganMatch = best;
    magMatchedPoint = bestPoint;
  } else {
    labelEl.textContent = "";
    magOrganMatch = null;
    magMatchedPoint = null;
  }
}

function stepMagnifier() {
  updateMagLabel();

  const isLeft  = magOrganMatch && magOrganMatch.key === "leftTendril";
  const isRight = magOrganMatch && magOrganMatch.key === "rightTendril";
  // Control tendril never touches anything, so its cross-section always
  // reads as the unstimulated (uniform) baseline — the same "before"
  // state the experimental one starts from.
  const localCoilProgress = isRight && coiling
    ? Math.max(0, Math.min(1, (hoursState - TENDRIL_ENABLE_HOUR) / (MAX_HOURS - TENDRIL_ENABLE_HOUR)))
    : 0;

  // Ease toward the matched point's actual local orientation. The
  // stick-contact side depends on which screen-side of the stick this
  // point of the coil currently sits on (x vs stickX) — NOT on isFront,
  // which only encodes rendering depth (front/back of the rotation) and
  // is a different axis of the coil's geometry entirely; reusing it here
  // was a real bug, since a point can be depth-"back" while still being
  // on the same screen-side of the stick as a depth-"front" point.
  const orientTarget = (isRight && magMatchedPoint && magMatchedPoint.isFront !== undefined)
    ? (magMatchedPoint.x < rightStickXGlobal ? 1 : -1)
    : 1;
  magOrientSign += (orientTarget - magOrientSign) * 0.05;

  // Packed capsule cells — theta=0 (right) is the contact/compact side
  // in the NORMAL orientation, theta=PI (left) is elongating/away.
  // magOrientSign flips which side is which as the magnifier crosses
  // to a point where the coil's local front/back has switched.
  const membranePts = [];
  for (let row = 0; row < N_ROWS; row++) {
    const nCols = N_COLS_PER_ROW[row];
    const ringBaseR = CORE_R + row * RING_SPACING;
    for (let col = 0; col < nCols; col++) {
      const theta = ((col + 0.5) / nCols) * Math.PI * 2;
      const elongateWeight = (1 - magOrientSign * Math.cos(theta)) / 2; // 1 on the elongating side, 0 on the compact side
      const isElongating = elongateWeight > 0.5;

      const length = BASE_CELL_L * (1 + elongateWeight * localCoilProgress * GROWTH_FACTOR[row]);
      const width = BASE_CELL_W * (1 - elongateWeight * localCoilProgress * 0.15); // narrows slightly as it stretches
      const centerDist = ringBaseR + (length - BASE_CELL_L) * 0.5;
      const cx = centerDist * Math.cos(theta), cy = centerDist * Math.sin(theta);
      const thetaDeg = (theta * 180) / Math.PI;

      const shadeShift = Math.sin(col * 2.3 + row * 1.7) * 6;
      let fillTone;
      if (row === 0) {
        fillTone = shadeVariant("#c7bd9a", shadeShift);
      } else if (isElongating) {
        fillTone = shadeVariant(row % 2 === 0 ? "#8bb562" : "#7aa551", shadeShift);
      } else {
        fillTone = shadeVariant(row % 2 === 0 ? "#c9a24a" : "#b8923d", shadeShift);
      }

      const cell = magCellGrid[row][col];
      cell.el.setAttribute("x", (-length / 2).toFixed(1));
      cell.el.setAttribute("y", (-width / 2).toFixed(1));
      cell.el.setAttribute("width", length.toFixed(1));
      cell.el.setAttribute("height", width.toFixed(1));
      cell.el.setAttribute("rx", (width / 2).toFixed(1)); // SVG clamps this, giving fully-rounded (capsule) ends
      cell.el.setAttribute("fill", fillTone);
      cell.el.setAttribute("transform", `translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${thetaDeg.toFixed(1)})`);

      // Nucleus — small Brownian jiggle local to the cell, riding
      // along as the cell's own center moves when it elongates.
      const jiggleBound = Math.min(1.8, width * 0.35);
      cell.vx += (Math.random() - 0.5) * 0.15 - cell.dx * 0.02;
      cell.vy += (Math.random() - 0.5) * 0.15 - cell.dy * 0.02;
      cell.vx *= 0.9; cell.vy *= 0.9;
      cell.dx += cell.vx; cell.dy += cell.vy;
      const jiggleDist = Math.hypot(cell.dx, cell.dy);
      if (jiggleDist > jiggleBound) { const s = jiggleBound / jiggleDist; cell.dx *= s; cell.dy *= s; }
      cell.dot.setAttribute("cx", (cx + cell.dx).toFixed(1));
      cell.dot.setAttribute("cy", (cy + cell.dy).toFixed(1));

      if (row === N_ROWS - 1) {
        const edgeR = centerDist + length / 2;
        membranePts.push({ x: edgeR * Math.cos(theta), y: edgeR * Math.sin(theta) });
      }
    }
  }
  document.getElementById("magMembrane").setAttribute("d", closedCatmullRomD(membranePts));
  const innerPts = membranePts.map((p) => ({ x: p.x * 0.93, y: p.y * 0.93 }));
  document.getElementById("magMembraneInner").setAttribute("d", closedCatmullRomD(innerPts));

  // Auxin migrates slowly toward the elongating zone, scattered as a
  // natural cloud rather than a clean line — each particle has its own
  // randomized angle and fixed radius jitter (not a shared radius), and
  // eases toward its target independently of (and slightly lagging)
  // the phase-2 growth sweep that actually drives localCoilProgress.
  const auxinTargetR = localCoilProgress > 0.03 ? 22 + localCoilProgress * 33 : 0; // stays inset from the membrane edge (~73 max reach)
  // Arc center rotates continuously with magOrientSign: acos(-1)=180deg
  // (normal, matches the original fixed design) through acos(1)=0deg
  // (fully flipped), smoothly sweeping through 90deg in between.
  const arcCenterTheta = Math.acos(Math.max(-1, Math.min(1, -magOrientSign)));
  magParticles.forEach((p) => {
    const target = Math.max(0, auxinTargetR + p.radiusJitter);
    p.easedR += (target - p.easedR) * 0.02;
    p.jx += (Math.random() - 0.5) * 0.55 - p.jx * 0.08;
    p.jy += (Math.random() - 0.5) * 0.55 - p.jy * 0.08;
    const jd = Math.hypot(p.jx, p.jy);
    if (jd > 6) { const s = 6 / jd; p.jx *= s; p.jy *= s; }
    const theta = arcCenterTheta + p.thetaOffset;
    const x = p.easedR * Math.cos(theta) + p.jx;
    const y = p.easedR * Math.sin(theta) + p.jy;
    p.el.setAttribute("cx", x.toFixed(1));
    p.el.setAttribute("cy", y.toFixed(1));
  });

  const leaderEl = document.getElementById("magLeaderLine");
  if (magOrganMatch && magMatchedPoint) {
    leaderEl.setAttribute("x1", magX.toFixed(1));
    leaderEl.setAttribute("y1", magY.toFixed(1));
    leaderEl.setAttribute("x2", magMatchedPoint.x.toFixed(1));
    leaderEl.setAttribute("y2", magMatchedPoint.y.toFixed(1));
    leaderEl.setAttribute("opacity", "1");
  } else {
    leaderEl.setAttribute("opacity", "0");
  }

  if (magnifierOn) magAnimId = requestAnimationFrame(stepMagnifier);
}

let magnifierOn = false;

function setMagnifier(on) {
  magnifierOn = on;
  const mag = document.getElementById("magnifier");
  document.getElementById("magBtn").classList.toggle("active", on);
  document.getElementById("magBtn").title = on ? "Hide Magnifier" : "Show Magnifier";
  if (on) {
    mag.style.display = "block";
    requestAnimationFrame(() => mag.setAttribute("opacity", "1"));
    if (magAnimId) cancelAnimationFrame(magAnimId);
    magAnimId = requestAnimationFrame(stepMagnifier);
  } else {
    mag.setAttribute("opacity", "0");
    if (magAnimId) cancelAnimationFrame(magAnimId);
    setTimeout(() => { if (!magnifierOn) mag.style.display = "none"; }, 300);
  }
}

function toSvgPoint(evt) {
  const svg = document.getElementById("scene");
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function render() {
  const soilSurfaceY = groundY - soilDepth + 6;
  const rightStickX = rightX + STICK_OFFSET;

  const leftStem  = buildStemPath(leftX,  soilSurfaceY, hoursState, 0.5);
  const rightStem = buildStemPath(rightX, soilSurfaceY, hoursState, 1.3);
  const leftTip  = leftStem[leftStem.length - 1];
  const rightTip = rightStem[rightStem.length - 1];

  const tendrilLen = stemTendrilLen(hoursState);
  document.getElementById("tendrilBtn").disabled = hoursState < TENDRIL_ENABLE_HOUR && !coiling;
  document.getElementById("playBtn").disabled = hoursState >= TENDRIL_ENABLE_HOUR;
  document.getElementById("hoursSlider").disabled = coiling;

  const leftTendril = buildSearchingTendril(leftTip.x, leftTip.y, tendrilLen, 2.1);
  const rightSearching = buildSearchingTendril(rightTip.x, rightTip.y, tendrilLen, 3.4);
  const rightCoiled = buildCoiledTendril(rightTip.x, rightTip.y, tendrilLen, rightStickX, 3.4);
  const rightTendril = coiling ? rightCoiled : rightSearching;

  const leftSeg = tendrilSegmentsMarkup(leftTendril);
  const rightSeg = tendrilSegmentsMarkup(rightTendril);

  document.getElementById("leftScene").innerHTML = `
    ${potMarkup(leftX)}
    ${stemMarkup(leftStem)}
    ${leftSeg.back}
    ${leftSeg.front}
  `;
  document.getElementById("rightScene").innerHTML = `
    ${potMarkup(rightX)}
    ${rightSeg.back}
    ${stickMarkup(rightStickX, soilSurfaceY)}
    ${stemMarkup(rightStem)}
    ${rightSeg.front}
  `;

  document.getElementById("hoursReadout").textContent = `t = ${hoursState.toFixed(0)}h`;
  document.getElementById("hoursSlider").value = hoursState;

  tendrilPaths = { leftTendril, rightTendril };
  rightStickXGlobal = rightStickX;

  const overallCoilProgress = coiling
    ? Math.max(0, Math.min(1, (hoursState - TENDRIL_ENABLE_HOUR) / (MAX_HOURS - TENDRIL_ENABLE_HOUR)))
    : 0;
  document.getElementById("controlStat").textContent =
    "Reaching outward — no support found, keeps growing straight";
  document.getElementById("experimentalStat").textContent = !coiling
    ? "Reaching toward the stick — click Tendril to make contact"
    : overallCoilProgress < 0.98
      ? `Coiling around the stick \u00b7 ${Math.round(overallCoilProgress * 100)}% wrapped`
      : "Fully coiled around the support";
}

function playFrame(now) {
  const elapsed = now - playStart;
  hoursState = Math.min(TENDRIL_ENABLE_HOUR, (elapsed / PLAY_DURATION_MS) * TENDRIL_ENABLE_HOUR);
  render();
  if (hoursState < TENDRIL_ENABLE_HOUR) {
    playRAF = requestAnimationFrame(playFrame);
  } else {
    playing = false;
    document.getElementById("playBtn").classList.remove("active");
  }
}

function startPlay() {
  if (hoursState >= TENDRIL_ENABLE_HOUR) return; // phase 1 is done — Tendril takes over from here
  playing = true;
  playStart = performance.now() - (hoursState / TENDRIL_ENABLE_HOUR) * PLAY_DURATION_MS;
  document.getElementById("playBtn").classList.add("active");
  playRAF = requestAnimationFrame(playFrame);
}

function stopPlay() {
  playing = false;
  document.getElementById("playBtn").classList.remove("active");
  if (playRAF) cancelAnimationFrame(playRAF);
}

function tendrilPlayFrame(now) {
  const elapsed = now - tendrilPlayStart;
  const span = MAX_HOURS - TENDRIL_ENABLE_HOUR;
  hoursState = Math.min(MAX_HOURS, TENDRIL_ENABLE_HOUR + (elapsed / TENDRIL_PLAY_DURATION_MS) * span);
  render();
  if (hoursState < MAX_HOURS) {
    tendrilPlayRAF = requestAnimationFrame(tendrilPlayFrame);
  } else {
    tendrilPlaying = false;
  }
}

function stopTendrilPlay() {
  tendrilPlaying = false;
  if (tendrilPlayRAF) cancelAnimationFrame(tendrilPlayRAF);
}

document.getElementById("playBtn").addEventListener("click", () => {
  if (playing) stopPlay(); else startPlay();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  stopPlay();
  stopTendrilPlay();
  hoursState = 0;
  coiling = false;
  document.getElementById("tendrilBtn").classList.remove("active");
  render();
  const btn = document.getElementById("resetBtn");
  btn.classList.remove("pulse");
  void btn.offsetWidth;
  btn.classList.add("pulse");
  btn.addEventListener("animationend", () => btn.classList.remove("pulse"), { once: true });
});

document.getElementById("tendrilBtn").addEventListener("click", () => {
  if (coiling || document.getElementById("tendrilBtn").disabled) return; // one-shot — Reset to replay
  stopPlay();
  hoursState = TENDRIL_ENABLE_HOUR; // start phase 2 from exactly here, regardless of how far past it the timer had scrubbed
  coiling = true;
  document.getElementById("tendrilBtn").classList.add("active");
  tendrilPlaying = true;
  tendrilPlayStart = performance.now();
  if (tendrilPlayRAF) cancelAnimationFrame(tendrilPlayRAF);
  tendrilPlayRAF = requestAnimationFrame(tendrilPlayFrame);
  render();
});

document.getElementById("hoursSlider").addEventListener("input", (e) => {
  stopPlay();
  stopTendrilPlay();
  hoursState = parseFloat(e.target.value);
  render();
});

document.getElementById("magBtn").addEventListener("click", () => setMagnifier(!magnifierOn));
document.getElementById("magScaleDownBtn").addEventListener("click", () => setMagScale(-0.15));
document.getElementById("magScaleUpBtn").addEventListener("click", () => setMagScale(0.15));

(function setupMagnifierDrag() {
  const mag = document.getElementById("magnifier");
  mag.addEventListener("pointerdown", (e) => {
    magDragging = true;
    mag.classList.add("dragging");
    mag.setPointerCapture(e.pointerId);
  });
  mag.addEventListener("pointermove", (e) => {
    if (!magDragging) return;
    const p = toSvgPoint(e);
    magX = p.x;
    magY = p.y;
    clampMagPosition();
    positionMagnifier();
  });
  mag.addEventListener("pointerup", (e) => {
    magDragging = false;
    mag.classList.remove("dragging");
    mag.releasePointerCapture(e.pointerId);
  });
  mag.addEventListener("pointercancel", () => {
    magDragging = false;
    mag.classList.remove("dragging");
  });
})();

render();
initMagParticles();
initMagCellRing();
positionMagnifier();
</script>
</body>
</html>
